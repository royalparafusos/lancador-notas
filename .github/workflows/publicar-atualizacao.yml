# =====================================================================
#  Publica uma ATUALIZAÇÃO do Lançador de Notas a cada alteração no código.
#
#  Quando algo muda em src/ ou no pom.xml (na branch main), o GitHub:
#   1. compila e roda os testes (num Windows, igual ao dos professores);
#   2. cria a versão 1.1.<número desta publicação>;
#   3. publica uma "Release" com o programa (lancador-notas-ded.jar) e o versao.json.
#  Os programas instalados encontram a versão nova ao abrir e se atualizam sozinhos.
#
#  Também dá para publicar na mão: aba Actions > "Publicar atualização" > Run workflow.
# =====================================================================
name: Publicar atualização

on:
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    env:
      CWS_ID: ${{ secrets.CWS_EXTENSION_ID }}
      EDGE_PRODUTO: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Definir versão
        id: v
        shell: bash
        run: |
          BASE=$(sed -n 's:.*<app.versao.base>\(.*\)</app.versao.base>.*:\1:p' pom.xml | head -1)
          LIBS=$(sed -n 's:.*<libs.versao>\(.*\)</libs.versao>.*:\1:p' pom.xml | head -1)
          echo "versao=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "libs=$LIBS" >> "$GITHUB_OUTPUT"
          echo "Versão: $BASE.${{ github.run_number }} (bibliotecas: $LIBS)"

      - name: Compilar e testar
        shell: bash
        run: mvn -B -q package "-Dapp.versao=${{ steps.v.outputs.versao }}"

      - name: Montar versao.json
        shell: bash
        run: |
          SHA=$(sha256sum target/lancador-notas-ded.jar | cut -d' ' -f1)
          NOVIDADES=$(git log -1 --pretty=%s | sed 's/\\/\\\\/g; s/"/\\"/g')
          URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.v.outputs.versao }}/lancador-notas-ded.jar"
          printf '{"versao":"%s","libsVersao":%s,"sha256":"%s","jar":"%s","novidades":"%s"}\n' \
            "${{ steps.v.outputs.versao }}" "${{ steps.v.outputs.libs }}" "$SHA" "$URL" "$NOVIDADES" > target/versao.json
          cat target/versao.json

      - name: Pacote do conector (para as lojas do Chrome e do Edge)
        id: ext
        shell: pwsh
        run: |
          $v = (Get-Content src/main/resources/extensao/manifest.json -Raw | ConvertFrom-Json).version
          "versao=$v" >> $env:GITHUB_OUTPUT
          Compress-Archive -Path src/main/resources/extensao/* -DestinationPath target/conector-ded.zip -Force
          Write-Host "Conector $v"

      - name: Publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.versao }}" \
            target/lancador-notas-ded.jar target/versao.json target/conector-ded.zip \
            --title "Versão ${{ steps.v.outputs.versao }}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest

      # ---------------------------------------------------------------
      #  Conector nas lojas: só roda quando os segredos existem
      #  (Settings > Secrets and variables > Actions). A loja só aceita
      #  versão nova do manifest.json; versão repetida é ignorada.
      # ---------------------------------------------------------------
      - name: Enviar conector para a Chrome Web Store
        if: ${{ env.CWS_ID != '' }}
        continue-on-error: true
        shell: bash
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          TOKEN=$(curl -s https://oauth2.googleapis.com/token -d client_id=$CWS_CLIENT_ID -d client_secret=$CWS_CLIENT_SECRET \
                  -d refresh_token=$CWS_REFRESH_TOKEN -d grant_type=refresh_token | sed -n 's/.*"access_token": *"\([^"]*\)".*/\1/p')
          curl -s -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" -X PUT -T target/conector-ded.zip \
               "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_ID"; echo
          curl -s -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" -H "Content-Length: 0" -X POST \
               "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_ID/publish"; echo

      - name: Enviar conector para a loja do Edge
        if: ${{ env.EDGE_PRODUTO != '' }}
        continue-on-error: true
        shell: bash
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          API=https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUTO/submissions
          curl -s -i -H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID" \
               -H "Content-Type: application/zip" -X POST -T target/conector-ded.zip "$API/draft/package" | head -1
          sleep 30
          curl -s -i -H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID" \
               -H "Content-Type: application/json" -X POST -d '{"notes":"Atualização automática"}' "$API" | head -1
