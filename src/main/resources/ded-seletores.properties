# =====================================================================
#  ONDE O PROGRAMA CLICA E DIGITA NO DED+ / Seg.ID
# =====================================================================
#  Arquivo editavel sem recompilar: ~/.lancador-notas-ded/ded-seletores.properties
#  Formato Playwright:  css=...   text=...   role=button[name=/x/i]
#  Alternativas separadas por  ||  (usa a primeira que existir na tela).
#
#  As telas de turmas, avaliacoes e notas NAO dependem de seletores CSS:
#  o programa acha os cartoes pelos TEXTOS abaixo (secao "Rotulos"),
#  que sao bem mais estaveis quando o DED+ muda o visual.
#
#  Delete este arquivo para voltar aos valores padrao do programa.
# =====================================================================
versao = 2

# ---------- LOGIN Seg.ID (ssc.prodemge.gov.br) - conferido em 25/11/2026 ----------
login.cpf        = css=input[name='j_username']
login.senha      = css=input[name='j_password']
login.entrar     = css=button.form__btn:has-text('ENTRAR') || role=button[name=/^entrar$/i]
# Cloudflare Turnstile ("nao sou um robo"). O programa NUNCA tenta burlar:
# espera ele liberar sozinho ou pede para o professor clicar.
login.turnstileToken = css=input[name='cf-turnstile-response']
login.turnstileCaixa = css=#captchaTurnstile || css=.cf-turnstile
login.erro       = css=.z-messagebox || css=.z-errorbox || text=/inv[aá]lid|incorret|bloquead|n[aã]o confere/i

# ---------- SELECAO DE UNIDADES (escola) ----------
unidades.titulo  = text=/sele[cç][aã]o de unidades/i

# ---------- DED+ ----------
ded.trocarUnidade   = text=/trocar unidade/i
turma.abrirAvaliacoes = role=link[name=/^avalia[cç][oõ]es$/i] || role=button[name=/^avalia[cç][oõ]es$/i] || text=/^avalia[cç][oõ]es$/i
avaliacoes.divisao  = css=select
avaliacoes.voltar   = text=/^voltar$/i
notas.salvar        = role=button[name=/salvar/i] || text=/^salvar$/i

# ---------- Rotulos (expressoes regulares) usados para achar os cartoes ----------
# 'exige': todas as expressoes separadas por ;; precisam aparecer no cartao
# Cartao de turma: tem o ano entre parenteses "(2026)" e o turno
rotulo.turma.ancora   = \\(\\d{4}\\)
rotulo.turma.exige    = MANH|TARDE|NOITE|INTEGRAL
# Tela de avaliacoes
rotulo.avaliacoes.pagina = Cadastrar avalia|Seleciona a divis
rotulo.avaliacao.ancora  = ^\\s*Valor Total
rotulo.avaliacao.exige   = Tipo;;Divis
# Tela de lancamento: cartao de aluno
rotulo.aluno.ancora   = ^\\s*Nota:?\\s*$
rotulo.aluno.exige    = N[aã]o realizada
rotulo.naoRealizada   = N[aã]o realizada
